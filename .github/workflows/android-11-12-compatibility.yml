name: Android 11 independent emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-11:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android tool paths
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle --no-daemon -p examples/ByTelliDeveloperLabV1 assembleDebug
      - name: Install emulator tools and Android 11 system image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64" </dev/null
          mkdir -p "$HOME/.android/avd"
          printf "no\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n byblack_api30 -k "system-images;android-30;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx byblack_api30
      - name: Start Android 11 without runner boot key events
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd byblack_api30 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > /tmp/byblack-emulator.log 2>&1 &
          echo $! > /tmp/byblack-emulator.pid
          adb wait-for-device
          echo "Emulator process started"
      - name: Wait for package manager and install APK
        run: |
          bash -euo pipefail -c '
            apk="examples/ByTelliDeveloperLabV1/app/build/outputs/apk/debug/app-debug.apk"
            for i in $(seq 1 120); do
              if ! kill -0 "$(cat /tmp/byblack-emulator.pid)" 2>/dev/null; then
                echo "Emulator exited unexpectedly"; tail -100 /tmp/byblack-emulator.log; exit 1
              fi
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)
              pkg=$(adb shell service check package 2>/dev/null | tr -d "\r" || true)
              if [ "$boot" = "1" ] && [ "$pkg" = "Service package: found" ]; then
                echo "Android boot and package service ready"
                break
              fi
              if [ $((i % 12)) -eq 0 ]; then echo "Waiting: boot=$boot package=$pkg attempt=$i"; fi
              sleep 5
            done
            if [ "$boot" != "1" ] || [ "$pkg" != "Service package: found" ]; then
              echo "Android 11 package manager unavailable"; tail -100 /tmp/byblack-emulator.log; exit 1
            fi
            for i in $(seq 1 5); do
              if adb install -r "$apk"; then echo "APK installed"; exit 0; fi
              sleep 10
            done
            echo "APK installation failed"; exit 1
          '
      - name: Launch and verify app
        run: |
          adb shell am start -W -n com.bytelli.developerlab/.MainActivity
          sleep 5
          adb shell pidof com.bytelli.developerlab | grep -Eq '[0-9]+'
          echo "Android 11 APK smoke test passed"
      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          adb shell getprop sys.boot_completed || true
          adb shell service check package || true
          tail -120 /tmp/byblack-emulator.log || true
