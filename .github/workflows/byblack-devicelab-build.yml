name: ByBlack DeviceLab V3 Bilingual APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/ByBlackDeviceLab/**'
      - '.github/workflows/byblack-devicelab-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34 using runner SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: examples/ByBlackDeviceLab
        run: |
          # The repository's AAPT2 override is for ARM64 Termux only.
          sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
          gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByBlack-DeviceLab-V3-Bilingual-debug
          path: examples/ByBlackDeviceLab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish V3 bilingual debug APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="examples/ByBlackDeviceLab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "ByBlack-DeviceLab-V3-Bilingual-debug.apk"
          TAG="devicelab-v3.0.0-bilingual"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ByBlack-DeviceLab-V3-Bilingual-debug.apk" --clobber
          else
            gh release create "$TAG" "ByBlack-DeviceLab-V3-Bilingual-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "ByBlack DeviceLab V3 — Türkçe / English" \
              --notes "ByBlack DeviceLab V3 Bilingual (TR/EN). Android hardware diagnostics, sensors, touchscreen and display tests, battery and RAM monitoring, device reports. In-app language selector remembers your preference. Tested by the developer on Samsung Galaxy S24 Ultra / Android 17. This is a debug APK, not a Play Store production-signed release. Source code: examples/ByBlackDeviceLab. Türkçe: Türkçe ve İngilizce arayüz, sensör, ekran, pil ve RAM testleri; deneysel debug APK."
          fi
